[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  included_files = ["server.js", "knowledge/**", "data/**"]

# page and API on the same address, so the app finds /api/... with nothing to configure
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
